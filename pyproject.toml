[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commands"
dynamic = ["version"]
description = "Mine commands"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Egor Egorov", email = "egigoka@gmail.com"}
]
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "termcolor",
    "pyperclip",
    "paramiko",
    "chardet",
    "psutil",
    "requests",
    "moviepy",
    "mutagen",
    "ping3",
    "wcwidth",
    "pywin32; platform_system=='Windows'",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
dev = ["build", "mypy", "pydocstyle", "pylint", "pytest", "pytest-cov"]
mssql = ["pyodbc"]
linux = ["python-xlib; platform_system=='Linux'"]
all = [
    "pyautogui; platform_system!='Linux'",
    "colorama; platform_system=='Windows'",
    "pywinrm; platform_system=='Windows'",
    "python-magic-win64; platform_system=='Windows'",
    "python-magic; platform_system!='Windows'",
    "pyodbc",
    "python-xlib; platform_system=='Linux'",
]

[project.urls]
Homepage = "https://www.github.com/egigoka/commands"
Repository = "https://www.github.com/egigoka/commands"

[tool.setuptools]
packages = ["commands"]
include-package-data = true

[tool.setuptools.package-data]
"commands" = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "commands._version.__version__"}

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
exclude = [
    "tests/",
    "build/",
    "dist/",
    "^trace_sleep\\.py$",
    "^multithread_limit_test\\.py$",
]
ignore_missing_imports = true

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = ["possibly-used-before-assignment"]

[tool.pylint.reports]
fail-under = 8.0
