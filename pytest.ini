[pytest]
# Memory-efficient pytest configuration

# Limit output and reduce memory overhead
addopts =
    # Run tests with minimal output to reduce memory
    -q
    # Disable warnings to reduce memory overhead
    -p no:warnings
    # Limit number of parallel workers (uncomment and adjust based on your RAM)
    # -n 2 (requires pytest-xdist)
    # Exit on first failure to avoid running all tests when debugging
    # --exitfirst
    # Show local variables on failure (useful but uses some memory)
    # --showlocals

# Test discovery settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Set timeout for tests (requires pytest-timeout plugin)
# timeout = 300

# Cache settings
cache_dir = .pytest_cache

# Markers to group tests by module type
markers =
    slow: marks tests as slow
    network: marks tests that require network
    gui: marks tests that require GUI
    file: marks tests for file operations
    instance: marks tests for instance methods
