name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: ubuntu-latest
            python: "3.14t"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install --upgrade pip ".[test]"
      - name: Run tests
        run: python -m pytest -q

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Check test matrix
        run: sh run_test_file_matrix_check.sh
      - name: Check docstrings
        run: sh run_styling_check.sh
      - name: Check types
        run: sh run_typing_check.sh
      - name: Check lint
        run: sh run_linting_check.sh
      - name: Build distributions
        run: python -m build
